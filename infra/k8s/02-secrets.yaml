# IMPORTANT: Do NOT commit real values.
# Create secrets via: kubectl create secret generic obraflux-secrets --from-env-file=.env -n obraflux
# Or use External Secrets Operator / Sealed Secrets in production.
apiVersion: v1
kind: Secret
metadata:
  name: obraflux-secrets
  namespace: obraflux
type: Opaque
stringData:
  DATABASE_URL: "postgresql://obraflux:CHANGE_ME@postgres-service:5432/obraflux"
  REDIS_URL: "redis://:CHANGE_ME@redis-service:6379"
  JWT_SECRET: "CHANGE_ME_jwt_secret_min_32_chars"
  JWT_REFRESH_SECRET: "CHANGE_ME_refresh_secret_min_32_chars"
  ENCRYPTION_KEY: "CHANGE_ME_32_hex_chars_for_aes256"
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
